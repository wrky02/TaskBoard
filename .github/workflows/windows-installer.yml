name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [build/windows-installer]
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Browser regression
        shell: pwsh
        run: |
          python -m venv .test-venv
          .test-venv\Scripts\python.exe -m pip install -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { throw 'Test dependencies failed' }
          .test-venv\Scripts\python.exe -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Browser installation failed' }
          Push-Location source\taskboard
          try {
            New-Item -ItemType Directory -Force -Path ..\..\artifacts | Out-Null
            ..\..\.test-venv\Scripts\python.exe test_browser.py *> ..\..\artifacts\browser-test.log
            $testExit = $LASTEXITCODE
            if ($testExit -ne 0) {
              ..\..\.test-venv\Scripts\python.exe ..\..\scripts\report-ci.py ..\..\artifacts\browser-test.log
              throw 'Browser regression failed; see annotation and diagnostic artifact'
            }
          } finally { Pop-Location }
      - name: Verify native Edge window icons
        shell: pwsh
        run: |
          .test-venv\Scripts\python.exe scripts\check-windows-icons.py *> artifacts/native-icons.log
          if ($LASTEXITCODE -ne 0) {
            .test-venv\Scripts\python.exe scripts\report-ci.py artifacts/native-icons.log 'Native window icons'
            throw 'Native window icon verification failed'
          }
          Get-Content artifacts/native-icons.log
      - name: Build and smoke-test EXE and installer
        shell: pwsh
        run: |
          $buildFailed = $false
          try { ./scripts/build-windows.ps1 *> artifacts/build-test.log; if ($LASTEXITCODE -ne 0) { $buildFailed = $true } }
          catch { $_ | Out-File -Append artifacts/build-test.log; $buildFailed = $true }
          if ($buildFailed) {
            .test-venv\Scripts\python.exe scripts\report-ci.py artifacts/build-test.log 'Windows build'
            throw 'Windows build failed; see diagnostic annotation'
          }
      - name: Test isolated install and uninstall preserve data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $install = Join-Path $env:RUNNER_TEMP 'TaskBoard-install-test'
          $installer = Start-Process -FilePath 'dist\Setup_TaskBoard_2.0.1.exe' -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$install`"") -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw 'Installer failed' }
          .build-venv\Scripts\python.exe scripts\smoke-packaged.py "$install\TaskBoard.exe" "$install\Data"
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke test failed' }
          $before = @{}
          Get-ChildItem "$install\Data" -File -Recurse | ForEach-Object { $before[$_.FullName] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          $uninstall = Start-Process -FilePath "$install\unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstall failed' }
          foreach ($path in $before.Keys) {
            if (-not (Test-Path $path)) { throw 'Uninstall removed user data' }
            if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $before[$path]) { throw 'Uninstall changed user data' }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TaskBoard-Windows-diagnostics
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: TaskBoard-Windows-2.0.1
          path: |
            dist/Setup_TaskBoard_2.0.1.exe
            dist/TaskBoard/
